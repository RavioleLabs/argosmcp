name: Windows credential storage
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/local/storage.ts'
      - 'src/foundation.ts'
      - 'scripts/check-os-credentials.mjs'
      - 'package-lock.json'
      - '.github/workflows/windows-credentials.yml'
  pull_request:
    paths:
      - 'src/local/storage.ts'
      - 'src/foundation.ts'
      - 'scripts/check-os-credentials.mjs'
      - 'package-lock.json'
      - '.github/workflows/windows-credentials.yml'
permissions:
  contents: read
jobs:
  credential-manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: node scripts/check-os-credentials.mjs
