name: Static security scan
on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Community Edition runs locally. No Semgrep account, code upload or API key.
      # Registry rule updates are intentional so scheduled checks detect new patterns.
      - run: pipx install semgrep==1.186.0
      - run: semgrep scan --config p/security-audit --config p/typescript --metrics=off --disable-version-check --error src cloudflare
